    <script>
        // 自訂「擠出形狀」：給 2D 頂點，長出有厚度的柱體
        // 用法：geometry="primitive: prism; points: x1 y1, x2 y2, x3 y3; depth: 厚度"
        AFRAME.registerGeometry('prism', {
        schema: {
            points: {type: 'string', default: '0 0, 1 0, 0 1'},
            depth: {type: 'number', default: 0.1}
        },
        init: function (data) {
            const pts = data.points.split(',').map(p => p.trim().split(/\s+/).map(Number));
            const shape = new THREE.Shape();
            pts.forEach(([x, y], i) => (i === 0 ? shape.moveTo(x, y) : shape.lineTo(x, y)));
            shape.closePath();
            const geometry = new THREE.ExtrudeGeometry(shape, {depth: data.depth, bevelEnabled: false});
            geometry.translate(0, 0, -data.depth / 2);
            this.geometry = geometry;
        }
        });
    </script>

    <script>
        // 讓平面產生柔和起伏：中間平坦，往外慢慢變明顯
        AFRAME.registerComponent('ground-waves', {
            schema: {
            height: {default: 0.5},       // 起伏高度（公尺）
            size: {default: 0.08},        // 起伏的密度，越大波浪越密
            flatRadius: {default: 10},    // 中間保持平坦的半徑
            fade: {default: 15}           // 從平坦過渡到完整起伏的距離
            },
            init: function () {
            const apply = () => {
                const mesh = this.el.getObject3D('mesh');
                if (!mesh) return;
                const d = this.data;
                const pos = mesh.geometry.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i), y = pos.getY(i);
                // 幾組不同方向的波疊在一起，看起來比較自然
                const h = Math.sin(x * d.size) * Math.cos(y * d.size * 1.3) * 0.6
                        + Math.sin((x + y) * d.size * 0.5) * 0.4;
                // 離中心越遠起伏越明顯
                const dist = Math.sqrt(x * x + y * y);
                const t = Math.min(Math.max((dist - d.flatRadius) / d.fade, 0), 1);
                const smooth = t * t * (3 - 2 * t);
                pos.setZ(i, h * d.height * smooth);
                }
                pos.needsUpdate = true;
                mesh.geometry.computeVertexNormals();
            };
            if (this.el.getObject3D('mesh')) apply();
            else this.el.addEventListener('object3dset', apply, {once: true});
            }
        });
    </script>

    <script>
        // 花瓣：半橢圓薄片，底邊平、上緣圓，從原點往 +y 長
        AFRAME.registerGeometry('petal', {
            schema: {
            width:    {default: 0.04},
            length:   {default: 0.05},
            depth:    {default: 0.002},
            segments: {default: 10}
            },
            init: function (d) {
            const shape = new THREE.Shape();
            for (let i = 0; i <= d.segments; i++) {
                const a = Math.PI - (Math.PI * i) / d.segments;
                const x = (d.width / 2) * Math.cos(a), y = d.length * Math.sin(a);
                if (i === 0) shape.moveTo(x, y); else shape.lineTo(x, y);
            }
            shape.closePath();
            const g = new THREE.ExtrudeGeometry(shape, {depth: d.depth, bevelEnabled: false});
            g.translate(0, 0, -d.depth / 2);
            this.geometry = g;
            }
        });

        // 半片葉子：從葉柄 (0,0) 沿 +y 長到葉尖，往 +x 鼓出（mirror: true 往 -x）
        // 兩個半片沿中脈折成 V 字，就有葉子彎曲的感覺
        AFRAME.registerGeometry('leaf-half', {
            schema: {
            width:    {default: 0.02},
            length:   {default: 0.07},
            depth:    {default: 0.002},
            mirror:   {default: false},
            segments: {default: 12}
            },
            init: function (d) {
            const s = d.mirror ? -1 : 1;
            const shape = new THREE.Shape();
            shape.moveTo(0, 0);
            for (let i = 1; i < d.segments; i++) {
                const t = i / d.segments;
                const w = d.width * Math.pow(Math.sin(Math.PI * t), 0.8) * (1 - 0.3 * t); // 靠葉柄那側比較寬
                shape.lineTo(s * w, d.length * t);
            }
            shape.lineTo(0, d.length);
            shape.closePath();
            const g = new THREE.ExtrudeGeometry(shape, {depth: d.depth, bevelEnabled: false});
            g.translate(0, 0, -d.depth / 2);
            this.geometry = g;
            }
        });

        // 一圈花瓣：自動繞圓排好 count 片
        // radius = 花瓣根部離中心多遠；tilt = 往外翻的角度（0 = 直立）；height = 這圈的高度
        AFRAME.registerComponent('petal-ring', {
            schema: {
            count:  {default: 6},
            radius: {default: 0.02},
            height: {default: 0},
            tilt:   {default: 30},
            width:  {default: 0.04},
            length: {default: 0.045},
            offset: {default: 0},     // 整圈轉幾度，讓每層花瓣錯開
            mixin:  {default: ''}
            },
            update: function () {
            while (this.el.firstChild) this.el.removeChild(this.el.firstChild);
            const d = this.data;
            for (let i = 0; i < d.count; i++) {
                const holder = document.createElement('a-entity');
                holder.setAttribute('rotation', `0 ${d.offset + (360 * i) / d.count} 0`);
                const p = document.createElement('a-entity');
                p.setAttribute('position', `0 ${d.height} ${d.radius}`);
                p.setAttribute('rotation', `${d.tilt} 0 0`);
                p.setAttribute('geometry', `primitive: petal; width: ${d.width}; length: ${d.length}`);
                if (d.mixin) p.setAttribute('mixin', d.mixin);
                holder.appendChild(p);
                this.el.appendChild(holder);
            }
            }
        });
    </script>

<body>
  <!-- fog：遠處淡出成夜空的顏色，near 開始變淡、far 完全看不到 -->

    <a-assets>

      <img id="sand" src="textures/sand.jpg" >
      <img id="b612-tex" src="textures/b612.jpg">

        <a-mixin id="m-fuselage"       material="color: #efe6d2; roughness: 0.85; flat-shading: true"></a-mixin>
        <a-mixin id="m-fuselage-open"  material="color: #efe6d2; roughness: 0.85; flat-shading: true; side: double"></a-mixin>
        <a-mixin id="m-wing"           material="color: #a4462f; roughness: 0.85; flat-shading: true; side: double"></a-mixin>
        <a-mixin id="m-wood"           material="color: #8b5a2b; roughness: 0.9;  flat-shading: true"></a-mixin>
        <a-mixin id="m-metal"          material="color: #9a9a9a; roughness: 0.6;  flat-shading: true"></a-mixin>
        <a-mixin id="m-engine"         material="color: #3d3d3d; roughness: 0.7;  flat-shading: true"></a-mixin>
        <a-mixin id="m-engine-detail"  material="color: #5c5c5c; roughness: 0.6;  flat-shading: true"></a-mixin>
        <a-mixin id="m-tire"           material="color: #2a2a2a; roughness: 0.95; flat-shading: true"></a-mixin>
        <a-mixin id="m-leather"        material="color: #5b3a29; roughness: 0.9;  flat-shading: true"></a-mixin>

        <a-mixin id="p-skin"   material="color: #f5d6b8; roughness: 0.9; flat-shading: true"></a-mixin>
        <a-mixin id="p-hair"   material="color: #e8b830; roughness: 0.8; flat-shading: true; side: double"></a-mixin>
        <a-mixin id="p-coat"   material="color: #8fbc5a; roughness: 0.9; flat-shading: true"></a-mixin>
        <a-mixin id="p-pants"  material="color: #7aa64a; roughness: 0.9; flat-shading: true"></a-mixin>
        <a-mixin id="p-shoe"   material="color: #6b4a2b; roughness: 0.8; flat-shading: true"></a-mixin>
        <a-mixin id="p-scarf"  material="color: #f2c230; roughness: 0.8; flat-shading: true; side: double"></a-mixin>
        <a-mixin id="p-brass"  material="color: #d9a521; roughness: 0.5; flat-shading: true"></a-mixin>

        <a-mixin id="f-skin"    material="color: #f2d3bd; roughness: 0.9; flat-shading: true"></a-mixin>
        <a-mixin id="f-jacket"  material="color: #7a4a2a; roughness: 0.8; flat-shading: true"></a-mixin>
        <a-mixin id="f-cap"     material="color: #5a3a22; roughness: 0.8; flat-shading: true; side: double"></a-mixin>
        <a-mixin id="f-fur"     material="color: #e8dcc4; roughness: 1;   flat-shading: true"></a-mixin>
        <a-mixin id="f-pants"   material="color: #6e5a45; roughness: 0.9; flat-shading: true"></a-mixin>
        <a-mixin id="f-boot"    material="color: #3b2a1e; roughness: 0.7; flat-shading: true"></a-mixin>
        <a-mixin id="f-frame"   material="color: #3a3a3a; roughness: 0.5; flat-shading: true"></a-mixin>
        <a-mixin id="f-glass"   material="color: #9fc6d6; roughness: 0.2; flat-shading: true"></a-mixin>
    
        <a-mixin id="b-ground" material="src: #b612-tex; repeat: 4 2; roughness: 1; flat-shading: true"></a-mixin>
        <!-- B612 底光：四盞共用這個設定，改這裡就能一次調整亮度和顏色 -->
        <a-mixin id="b612-fill" light="type: point; color: #FFFFFF; intensity: 0.3; distance: 25; decay: 0"></a-mixin>

        <a-mixin id="b-glass"  material="color: #d6ecff; roughness: 0.05; metalness: 0.1; opacity: 0.25; transparent: true; side: double"></a-mixin>
        <a-mixin id="b-box"    material="color: #c8a878; roughness: 0.9; flat-shading: true"></a-mixin>
        <a-mixin id="b-hole"   material="color: #1a1a1a; roughness: 1"></a-mixin>
        <a-mixin id="b-volcano" material="color: #8a6a55; roughness: 1;  flat-shading: true"></a-mixin>
        <a-mixin id="b-lava"   material="color: #ff6a2a; emissive: #ff4a10; emissiveIntensity: 0.8"></a-mixin>


    </a-assets>

         segments-width="150" segments-height="150"

         material="src: #sand; repeat: 100 100; roughness: 1"

    <!-- fog: false 讓天空不受霧影響，不然星星會被霧蓋掉 -->
    <a-sky radius="500" material="src: #stars; fog: false"></a-sky>


   <!-- 宇宙底光：整個場景都照得到，很暗，讓星球背光面不會全黑 -->
    <a-entity id="space-ambient" light="type: ambient; color: #6b7bb0; intensity: 0.15"></a-entity>

    <!-- 地球燈光：攝影機飛高時慢慢關掉 -->
    <a-entity id="earth-ambient" light="type: ambient; color: #6b7bb0; intensity: 0.35" altitude-fade></a-entity>
    <a-entity id="earth-moon" light="type: directional; color: #d0dcff; intensity: 0.8" position="-3 6 4" altitude-fade></a-entity>

    <!-- 攝影機：觀眾的眼睛，高度 1.6 公尺 -->
    <!--a-entity camera look-controls wasd-controls position="0 1.6 2"></a-entity-->

        <a-entity id="cam" camera position="0 0 0" look-controls></a-entity>
    </a-entity>


    <!-- ===================== 星球位置 ===================== -->
    <a-entity id="planet-lamplighter" position="50 160 90" lamplighter-planet></a-entity>
    <a-entity id="planet-drunkard" position="-100 200 15" scale="2.5 2.5 2.5"drunkard-planet></a-entity>

    <!--===========================B612=============================-->
    <a-entity id="planet-b612" position="-132.6 313.8 -142.6">

        <!-- ===== B612 底光：從四面八方照，整顆星球都亮 =====
        星球中心在原點，四盞燈離中心約 10 公尺；只照 B612 附近 -->
        <a-entity id="b612-fill-lights">
        <a-entity position="5.8 5.8 5.8"   mixin="b612-fill"></a-entity>
        <a-entity position="5.8 -5.8 -5.8" mixin="b612-fill"></a-entity>
        <a-entity position="-5.8 5.8 -5.8" mixin="b612-fill"></a-entity>
        <a-entity position="-5.8 -5.8 5.8" mixin="b612-fill"></a-entity>
        </a-entity>

        <a-sphere id="b612-ground" radius="2" segments-width="28" segments-height="20" mixin="b-ground"></a-sphere>

        <!-- ===== 玫瑰 ===== -->
        <a-entity id="b612-place-rose" rotation="1.56 107.05 -1.48">
            <a-entity position="0 1.995 0">
                <a-entity id="b612-rose">
                    <!-- 莖 -->
                    <a-cylinder radius="0.004" height="0.25" position="0 0.125 0" mixin="b-stem"></a-cylinder>
                    <!-- 刺：三角薄片，外層 rotation y = 長在莖的哪一側 -->
                    <a-entity rotation="0 0 0">
                        <a-entity geometry="primitive: prism; points: -0.003 0, 0.003 0, 0 0.01; depth: 0.002"
                            position="0 0.08 0.003" rotation="60 0 0" mixin="b-stem"></a-entity>
                    </a-entity>
                    <a-entity rotation="0 130 0">
                            <a-entity geometry="primitive: prism; points: -0.003 0, 0.003 0, 0 0.01; depth: 0.002"
                                position="0 0.13 0.003" rotation="60 0 0" mixin="b-stem"></a-entity>
                    </a-entity>
                    <a-entity rotation="0 250 0">
                        <a-entity geometry="primitive: prism; points: -0.003 0, 0.003 0, 0 0.01; depth: 0.002"
                            position="0 0.18 0.003" rotation="60 0 0" mixin="b-stem"></a-entity>
                    </a-entity>

                    <!-- 葉子：兩個半片沿中脈折成 V 字
                        外層 rotation y = 朝哪個方向；中層 rotation x = 往外倒的角度（90 = 水平）；
                        內層兩片的 rotation y = 折起來的角度（越大越彎） -->
                    <a-entity rotation="0 30 0">
                        <a-entity position="0 0.03 0.003" rotation="70 0 0">
                            <a-entity geometry="primitive: leaf-half; width: 0.022; length: 0.07" rotation="0 25 0" mixin="b-leaf"></a-entity>
                            <a-entity geometry="primitive: leaf-half; width: 0.022; length: 0.07; mirror: true" rotation="0 -25 0" mixin="b-leaf"></a-entity>
                        </a-entity>
                    </a-entity>
                    <a-entity rotation="0 150 0">
                        <a-entity position="0 0.05 0.003" rotation="65 0 0">

                            <a-entity geometry="primitive: leaf-half; width: 0.02; length: 0.065; mirror: true" rotation="0 -25 0" mixin="b-leaf"></a-entity>
                        </a-entity>
                    </a-entity>
                    <a-entity rotation="0 270 0">
                        <a-entity position="0 0.07 0.003" rotation="60 0 0">
                            <a-entity geometry="primitive: leaf-half; width: 0.018; length: 0.06" rotation="0 25 0" mixin="b-leaf"></a-entity>
                            <a-entity geometry="primitive: leaf-half; width: 0.018; length: 0.06; mirror: true" rotation="0 -25 0" mixin="b-leaf"></a-entity>
                        </a-entity>

                    <!-- 花：綠色花托 + 半球杯子 + 四層花瓣（越裡面越小、越直立、片數越少） -->
                    <a-entity id="b612-rose-head" position="0 0.25 0">
                        <a-cone radius-bottom="0.004" radius-top="0.014" height="0.016" position="0 -0.035 0" mixin="b-stem"></a-cone>

                <a-entity geometry="primitive: prism; points: -0.016 0, 0.016 0, 0 -0.045; depth: 0.008"

                <a-entity geometry="primitive: prism; points: -0.016 0, 0.016 0, 0 -0.038; depth: 0.008"

                <a-entity geometry="primitive: prism; points: -0.016 0, 0.016 0, 0 -0.04; depth: 0.008"

     第三層 rotation x -70 = 平貼頭髮、髮尖翹起約 20 度 -->
            <a-entity id="prince-tufts" position="0 0.082 -0.008">

        <a-entity id="pilot-arm-right" position="-0.17 0.504 -0.069" rotation="29.4 0 -10.6">

        <a-entity id="pilot-shin-left" position="0.232 0.137 0.291" rotation="15.4 -105 0">
